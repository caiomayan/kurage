services:
  db:
    image: postgres:16-alpine
    container_name: kurage_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-kuragedb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kurage_redis_dev
    restart: always
    ports:
      - "6379:6379"

  mongo:
    image: mongo:6-jammy
    container_name: kurage_mongo_dev
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
    ports:
      - "27017:27017"
    volumes:
      - mongodata_dev:/data/db

volumes:
  pgdata_dev:
  mongodata_dev: