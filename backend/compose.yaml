services:
  db:
    image: postgres:16-alpine
    container_name: kurage_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-kuragedb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kurage_redis_dev
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata_dev:
