services:
  db:
    image: postgres:16-alpine
    container_name: kurage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1200M

  redis:
    image: redis:7-alpine
    container_name: kurage_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 384M

  api:
    image: ${KURAGE_API_IMAGE:-kurage-api:local}
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: kurage_api
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME:?DB_NAME is required}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:?DB_USER is required}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - SPRING_DOCKER_COMPOSE_ENABLED=false
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=${DB_POOL_MAX_SIZE:-10}
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=${DB_POOL_MIN_IDLE:-2}
      - JAVA_OPTS=${JAVA_OPTS:--Xms256m -Xmx1200m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
      - STEAM_API_KEY=${STEAM_API_KEY:?STEAM_API_KEY is required}
      - FACEIT_API_KEY=${FACEIT_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - FRONTEND_ADDITIONAL_ORIGINS=${FRONTEND_ADDITIONAL_ORIGINS:-}
      - BACKEND_URL=${BACKEND_URL:?BACKEND_URL is required}
      # Keep blank for host-only auth cookies on the API domain. A parent-domain
      # cookie unnecessarily lets sibling subdomains overwrite session state.
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - GAME_SERVER_API_KEY=${GAME_SERVER_API_KEY:?GAME_SERVER_API_KEY is required}
      - GAME_SERVER_BOOTSTRAP_ENABLED=true
      - FIXED_SERVER_ID=${FIXED_SERVER_ID:?FIXED_SERVER_ID is required}
      - FIXED_SERVER_DISPLAY_NAME=${FIXED_SERVER_DISPLAY_NAME:?FIXED_SERVER_DISPLAY_NAME is required}
      - FIXED_SERVER_HOSTNAME=${FIXED_SERVER_HOSTNAME:?FIXED_SERVER_HOSTNAME is required}
      - FIXED_SERVER_PORT=${FIXED_SERVER_PORT:?FIXED_SERVER_PORT is required}
      - FIXED_SERVER_MAX_PLAYERS=${FIXED_SERVER_MAX_PLAYERS:-10}
      - CLOUDFLARE_R2_ACCESS_KEY=${CLOUDFLARE_R2_ACCESS_KEY}
      - CLOUDFLARE_R2_SECRET_KEY=${CLOUDFLARE_R2_SECRET_KEY}
      - CLOUDFLARE_R2_ENDPOINT=${CLOUDFLARE_R2_ENDPOINT}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME:-kurage-bucket}
      - CLOUDFLARE_R2_PUBLIC_URL=${CLOUDFLARE_R2_PUBLIC_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1600M

  caddy:
    image: caddy:2-alpine
    container_name: kurage_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
