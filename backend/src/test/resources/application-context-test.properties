# Full Spring wiring gate for CI. No external service is required.
spring.main.lazy-initialization=false

# Exercise Hibernate, JPA repositories and auditing against an ephemeral database.
spring.datasource.url=jdbc:h2:mem:kurage_context;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Clients and repositories are wired, but context startup must not open network connections.
spring.mongodb.uri=mongodb://localhost:27017/kurage_context?serverSelectionTimeoutMS=100&connectTimeoutMS=100
spring.data.mongodb.auto-index-creation=false
spring.data.redis.connect-timeout=100ms
spring.data.redis.timeout=100ms
management.health.mongo.enabled=false
management.health.redis.enabled=false

# Deterministic, non-secret values for required integration properties.
steam.api.key=context-test
frontend.url=http://localhost:3000
backend.url=http://localhost:8080
cookie.domain=
api.security.token.secret=Y29udGV4dC10ZXN0LWp3dC1zZWNyZXQtdGhhdC1pcy1ub3QtcHJvZHVjdGlvbg==
faceit.api.key=context-test
