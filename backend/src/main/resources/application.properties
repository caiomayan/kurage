spring.config.import=optional:file:.env[.properties]

spring.application.name=kurage-api

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Actuator Config
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
observability.slow-request-threshold-ms=${SLOW_REQUEST_THRESHOLD_MS:1000}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Datasource (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kuragedb}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# Public image uploads are decoded and re-encoded by the API. Container-level
# bounds reject oversized multipart bodies before they consume application heap.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Auth & URLs
steam.api.key=${STEAM_API_KEY}
frontend.url=${FRONTEND_URL:http://localhost:3000}
frontend.additional-origins=${FRONTEND_ADDITIONAL_ORIGINS:}
backend.url=${BACKEND_URL:http://localhost:8080}
cookie.domain=${COOKIE_DOMAIN:}
api.security.token.secret=${JWT_SECRET}

# Faceit Integration
faceit.api.key=${FACEIT_API_KEY}
faceit.cache.duration=${FACEIT_CACHE_DURATION:300000}

# Game Servers
game.server.api.key=${GAME_SERVER_API_KEY:}
game.server.bootstrap.enabled=${GAME_SERVER_BOOTSTRAP_ENABLED:false}
game.server.bootstrap.id=${FIXED_SERVER_ID:b1a2c3d4-0000-0000-0000-000000000001}
game.server.bootstrap.display-name=${FIXED_SERVER_DISPLAY_NAME:}
game.server.bootstrap.hostname=${FIXED_SERVER_HOSTNAME:}
game.server.bootstrap.port=${FIXED_SERVER_PORT:27015}
game.server.bootstrap.max-players=${FIXED_SERVER_MAX_PLAYERS:10}
game.server.offline-scan-ms=${GAME_SERVER_OFFLINE_SCAN_MS:30000}

# Cloudflare R2 Config
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY:}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY:}
cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT:}
cloudflare.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME:}
cloudflare.r2.public-url=${CLOUDFLARE_R2_PUBLIC_URL:}

# Performance Optimizations (Java 21 / Tomcat / HikariCP)
spring.threads.virtual.enabled=true

server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=10000

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:25}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=20000
