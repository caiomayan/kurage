spring.config.import=optional:file:.env[.properties]

spring.application.name=kurage-api

server.port=8080
server.forward-headers-strategy=framework

# Actuator Config
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# MongoDB Configuration
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/kurage_notifications}
spring.mongodb.representation.uuid=standard
spring.data.mongodb.auto-index-creation=true

# Datasource (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kuragedb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.open-in-view=false
spring.docker.compose.enabled=true

# Auth & URLs
steam.api.key=${STEAM_API_KEY}
frontend.url=${FRONTEND_URL:http://localhost:3000}
backend.url=${BACKEND_URL:http://localhost:8080}
cookie.domain=${COOKIE_DOMAIN:}
api.security.token.secret=${JWT_SECRET}

# Faceit Integration
faceit.api.key=${FACEIT_API_KEY}
faceit.cache.duration=${FACEIT_CACHE_DURATION:300000}

# Game Servers
game.server.api.key=${GAME_SERVER_API_KEY:}

# Cloudflare R2 Config
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY:}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY:}
cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT:}
cloudflare.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME:}
cloudflare.r2.public-url=${CLOUDFLARE_R2_PUBLIC_URL:}

# Performance Optimizations (Java 21 / Tomcat / HikariCP)
spring.threads.virtual.enabled=true

server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=10000

spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
