name: OCI infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: kurage-oci-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.operation }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: alpha-infrastructure
    defaults:
      run:
        working-directory: infra/terraform/oci
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_REGION: ${{ vars.OCI_REGION }}
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_ssh_public_key: ${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}
      TF_VAR_ssh_allowed_cidr: ${{ vars.SSH_ALLOWED_CIDR }}
      TF_VAR_availability_domain_index: ${{ vars.OCI_AVAILABILITY_DOMAIN_INDEX || '0' }}
      TF_VAR_allow_github_hosted_ssh_deploy: ${{ vars.ALLOW_GITHUB_HOSTED_SSH_DEPLOY || 'true' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_NAMESPACE: ${{ vars.TF_STATE_NAMESPACE }}

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Install OCI API key
        shell: bash
        env:
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
        run: |
          key_file="${RUNNER_TEMP}/oci-api-key.pem"
          printf '%s' "${OCI_API_PRIVATE_KEY}" > "${key_file}"
          chmod 0600 "${key_file}"
          echo "OCI_PRIVATE_KEY_PATH=${key_file}" >> "${GITHUB_ENV}"

      - name: Initialize remote state
        shell: bash
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="namespace=${TF_STATE_NAMESPACE}" \
            -backend-config="key=kurage/alpha/oci.tfstate" \
            -backend-config="tenancy_ocid=${OCI_TENANCY_OCID}" \
            -backend-config="user_ocid=${OCI_USER_OCID}" \
            -backend-config="fingerprint=${OCI_FINGERPRINT}" \
            -backend-config="private_key_path=${OCI_PRIVATE_KEY_PATH}" \
            -backend-config="region=${OCI_REGION}"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate configuration
        run: terraform validate

      - name: Create reviewed plan
        run: terraform plan -lock-timeout=5m -out="${RUNNER_TEMP}/kurage.tfplan"

      - name: Apply reviewed plan
        if: inputs.operation == 'apply'
        run: terraform apply -lock-timeout=5m -auto-approve "${RUNNER_TEMP}/kurage.tfplan"

      - name: Publish infrastructure outputs
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          public_ip="$(terraform output -raw backend_public_ip)"
          {
            echo "## OCI infrastructure applied"
            echo
            echo "- Reserved backend IP: \`${public_ip}\`"
            echo "- Set the GitHub environment variable \`OCI_HOST\` to this IP."
            echo "- Point \`api.caiomayan.com\` to this IP before the first backend deploy."
            echo "- Wait for cloud-init to finish before deploying: \`cloud-init status --wait\`."
          } >> "${GITHUB_STEP_SUMMARY}"
