name: Frontend quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_APP_URL: https://kurage.caiomayan.com
      NEXT_PUBLIC_API_URL: https://api.caiomayan.com
      NEXT_PUBLIC_CS2_CONNECT_HOST: retake.caiomayan.com:27015
      NEXT_PUBLIC_R2_PUBLIC_URL: https://assets.caiomayan.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
