version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Revisit when eslint-config-next's React plugins support the next ESLint major.
    # Minor and patch updates remain enabled.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
