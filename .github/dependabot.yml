version: 2
# Keep this policy on the default branch: Dependabot reads it there.
# Version updates target dev. Separate default-branch entries retain grouped
# security updates without duplicating routine version-update PRs on main.
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Fortaleza
    open-pull-requests-limit: 2
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    # Revisit when eslint-config-next's React plugins support the next ESLint major.
    # Minor and patch updates remain enabled.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Fortaleza
    open-pull-requests-limit: 2
    groups:
      backend-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Fortaleza
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  # Security updates only, on the default branch (main). Do not add target-branch.
  # A zero limit disables version PRs here, not security PRs or alerts.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      backend-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
